[project]
name = "castle-clash-mcp"
version = "0.1.0"
description = "MCP server for Castle Clash hero data, tier lists and rule-based build recommendations"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2.0", "httpx>=0.27", "beautifulsoup4>=4.12"]

[project.scripts]
ccmcp-server = "ccmcp.server:main"
ccmcp-refresh = "ccmcp.refresh:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ccmcp"]
